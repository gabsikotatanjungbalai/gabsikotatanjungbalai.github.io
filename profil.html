<title>Profil GABSI Kota Tanjungbalai</title>

<style>

:root{
 --navy:#073b61;
 --navy2:#0a567f;
 --red:#d71920;
 --gold:#f4c44e;
 --ink:#102538;
 --muted:#5f7282;
 --bg:#f4f8fb;
 --card:#ffffff;
 --line:#dce6ed;
 --shadow:0 14px 40px rgba(8,39,61,.11);
}

*{
 box-sizing:border-box;
}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 font-family:Inter,Segoe UI,Arial,sans-serif;
 background:var(--bg);
 color:var(--ink);
}

a{
 color:inherit;
}

.container{
 max-width:1180px;
 margin:auto;
 padding:0 22px;
}


/* =========================
   TOP BAR
========================= */

.topbar{
 background:#032c49;
 color:#dfeaf1;
 font-size:12px;
}

.topbar .inner{
 display:flex;
 justify-content:space-between;
 gap:16px;
 padding:8px 0;
}


/* =========================
   NAVIGASI
========================= */

.nav{
 position:sticky;
 top:0;
 z-index:50;
 background:rgba(255,255,255,.96);
 backdrop-filter:blur(12px);
 border-bottom:1px solid var(--line);
}

.nav-inner{
 height:72px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:20px;
}

.brand{
 display:flex;
 align-items:center;
 gap:12px;
 text-decoration:none;
 min-width:0;
}

.brand img{
 width:48px;
 height:48px;
}

.brand strong{
 display:block;
 font-size:20px;
 line-height:1.05;
 color:var(--navy);
}

.brand span{
 display:block;
 font-size:10px;
 letter-spacing:.4px;
 color:#607587;
 margin-top:3px;
}

.nav-links{
 display:flex;
 align-items:center;
 gap:5px;
}

.nav-links a{
 padding:10px 11px;
 border-radius:10px;
 text-decoration:none;
 font-weight:700;
 font-size:13px;
 color:#294458;
}

.nav-links a:hover,
.nav-links a.active{
 background:#eaf4fa;
 color:var(--navy);
}

.menu{
 display:none;
 border:1px solid var(--line);
 background:#fff;
 border-radius:10px;
 padding:10px 12px;
 cursor:pointer;
}


/* =========================
   HERO PROFIL
========================= */

.page-hero{
 background:linear-gradient(
  125deg,
  #052f4c,
  #0a5e89 66%,
  #0b7794
 );
 color:#fff;
 padding:75px 0;
}

.page-hero .eyebrow{
 color:#ffd76a;
}

.page-hero h1{
 font-size:clamp(40px,5vw,60px);
 line-height:1;
 margin:12px 0 16px;
 letter-spacing:-1.5px;
}

.page-hero p{
 max-width:720px;
 color:#e5f2f8;
 line-height:1.75;
 font-size:16px;
 margin:0;
}


/* =========================
   SECTION
========================= */

section{
 padding:65px 0;
}

.section-head{
 margin-bottom:25px;
}

.eyebrow{
 color:var(--navy2);
 font-size:12px;
 font-weight:900;
 letter-spacing:1px;
 text-transform:uppercase;
}

.section-head h2{
 margin:7px 0;
 font-size:32px;
 letter-spacing:-.5px;
}

.section-head p{
 color:var(--muted);
 line-height:1.7;
 max-width:760px;
}


/* =========================
   CARD
========================= */

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:22px;
}

.panel{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:20px;
 padding:27px;
 box-shadow:var(--shadow);
}

.panel h3{
 margin:0 0 12px;
 font-size:22px;
}

.panel p{
 color:#526875;
 line-height:1.75;
 margin:10px 0;
}


/* =========================
   KETUA
========================= */

.profile-card{
 display:grid;
 grid-template-columns:240px 1fr;
 gap:28px;
 align-items:center;
}

.profile-card img{
 width:240px;
 height:300px;
 object-fit:cover;
 object-position:center 25%;
 border-radius:18px;
}

.tag{
 display:inline-block;
 padding:6px 10px;
 border-radius:999px;
 background:#eaf4fa;
 color:var(--navy);
 font-size:11px;
 font-weight:900;
}

.profile-card h3{
 margin:12px 0 8px;
 font-size:25px;
}

.profile-card .period{
 color:var(--navy);
 font-weight:800;
}


/* =========================
   NILAI
========================= */

.values{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
}

.value{
 border:1px solid var(--line);
 border-radius:16px;
 padding:20px;
 background:#fbfdff;
}

.value .icon{
 font-size:30px;
 margin-bottom:12px;
}

.value b{
 display:block;
 margin-bottom:7px;
 color:var(--navy);
}

.value span{
 color:var(--muted);
 font-size:13px;
 line-height:1.55;
}


/* =========================
   HIGHLIGHT
========================= */

.highlight{
 background:linear-gradient(
  135deg,
  #073b61,
  #0a6b91
 );
 color:white;
}

.highlight p{
 color:#dcecf5;
}

.highlight .tag{
 background:rgba(255,255,255,.15);
 color:white;
}


/* =========================
   TOMBOL
========================= */

.btn{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:8px;
 padding:12px 16px;
 border-radius:11px;
 text-decoration:none;
 font-weight:800;
 background:var(--navy);
 color:white;
 margin-top:10px;
}


/* =========================
   FOOTER
========================= */

footer{
 background:#062f4b;
 color:#dfeaf1;
 padding:34px 0 18px;
}

.footer-grid{
 display:grid;
 grid-template-columns:1.2fr .8fr .8fr;
 gap:25px;
}

.footer-brand{
 font-size:23px;
 font-weight:900;
 color:#fff;
}

.footer-grid p{
 color:#b8cad5;
 line-height:1.6;
}

.footer-grid a{

 text
