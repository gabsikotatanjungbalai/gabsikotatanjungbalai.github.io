<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<meta name="theme-color" content="#071c16">

<title>Game Bridge GABSI Kota Tanjungbalai</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#04120e;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    background:#071b15;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    height:58px;
    padding:7px 9px;
    display:flex;
    align-items:center;
    gap:8px;
    background:#04130f;
    border-bottom:1px solid #21483b;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    width:40px;
    height:40px;
    flex:none;
    border-radius:9px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        145deg,
        #f0d47a,
        #9b7020
    );
    color:#07130f;
    font-size:22px;
    font-weight:bold;
}

.title{
    min-width:0;
    flex:1;
}

.title strong{
    display:block;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.title span{
    display:block;
    color:#8faea3;
    font-size:9px;
    margin-top:2px;
}

.newgame{
    border:1px solid #496f62;
    background:#12372b;
    color:#fff;
    border-radius:8px;
    padding:8px 9px;
    font-size:11px;
    font-weight:bold;
}

/* =====================================================
   BOARD BAR
===================================================== */

.boardbar{
    height:40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    background:#09241b;
    border-bottom:1px solid #21483b;
    font-size:11px;
}

.boardbar b{
    color:#e9cc72;
}

.turn{
    padding:4px 7px;
    border-radius:6px;
    background:#153d30;
}

/* =====================================================
   TABLE
===================================================== */

.table{
    position:relative;
    width:calc(100% - 10px);
    margin:5px;
    height:570px;

    background:
    radial-gradient(
        ellipse at center,
        #0d704b 0%,
        #09583c 48%,
        #063d2b 100%
    );

    border:2px solid #1a674b;
    border-radius:17px;

    box-shadow:
    inset 0 0 45px rgba(0,0,0,.45),
    0 5px 20px rgba(0,0,0,.5);

    overflow:hidden;
}

.table:after{
    content:"GABSI";
    position:absolute;
    left:50%;
    top:50%;
    transform:
        translate(-50%,-50%)
        rotate(-20deg);

    color:rgba(255,255,255,.035);
    font-size:68px;
    font-weight:900;
    letter-spacing:7px;

    pointer-events:none;
}

/* =====================================================
   PLAYER SEATS
===================================================== */

.player{
    position:absolute;
    z-index:20;
    text-align:center;
}

.north{
    top:7px;
    left:50%;
    transform:translateX(-50%);
}

.south{
    bottom:5px;
    left:50%;
    transform:translateX(-50%);
}

.west{
    left:3px;
    top:48%;
    transform:translateY(-50%);
}

.east{
    right:3px;
    top:48%;
    transform:translateY(-50%);
}

.player-name{
    display:inline-block;
    padding:4px 7px;
    border-radius:7px;

    background:rgba(3,19,14,.92);
    border:1px solid #467565;

    font-size:9px;
    font-weight:bold;

    white-space:nowrap;
}

.player-name.you{
    color:#f0d274;
}

/* =====================================================
   CARDS
===================================================== */

.hand{
    display:flex;
    justify-content:center;
    align-items:center;
}

.hand.vertical{
    flex-direction:column;
}

.hand.vertical .card{
    margin-top:-17px;
}

.hand.vertical .card:first-child{
    margin-top:0;
}

.card{
    width:42px;
    height:60px;

    flex:none;

    border-radius:6px;
    border:1px solid #aaa;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e7e7e2
        );

    color:#111;

    padding:4px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    box-shadow:
        0 2px 5px rgba(0,0,0,.55);

    font-size:11px;

    cursor:pointer;

    user-select:none;

    position:relative;

    transition:.12s;
}

.card:hover{
    transform:translateY(-6px);
    z-index:50;
}

.card.red{
    color:#c72828;
}

.corner{
    font-size:11px;
    line-height:10px;
    font-weight:bold;
}

.symbol{
    text-align:center;
    font-size:21px;
    line-height:21px;
}

.back{
    cursor:default;

    background:
    repeating-linear-gradient(
        45deg,
        #154e88 0px,
        #154e88 4px,
        #dce7f4 4px,
        #dce7f4 6px
    );

    border:2px solid white;
}

/* =====================================================
   CENTER INFO
===================================================== */

.center-info{
    position:absolute;
    z-index:25;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:155px;

    padding:9px;

    text-align:center;

    border-radius:10px;

    background:rgba(3,22,16,.86);

    border:1px solid #3f7564;

    font-size:10px;
}

.center-info strong{
    display:block;
    color:#e9cd70;
    font-size:14px;
    margin-bottom:3px;
}

/* =====================================================
   PLAYED CARDS
===================================================== */

.played{
    position:absolute;

    width:44px;
    height:62px;

    z-index:40;
}

.played.n{
    top:35%;
    left:50%;
    transform:translate(-50%,-50%);
}

.played.s{
    bottom:34%;
    left:50%;
    transform:translate(-50%,50%);
}

.played.w{
    left:34%;
    top:50%;
    transform:translate(-50%,-50%);
}

.played.e{
    right:34%;
    top:50%;
    transform:translate(50%,-50%);
}

/* =====================================================
   INFORMATION PANEL
===================================================== */

.panel{
    margin:5px;

    background:#081f18;

    border:1px solid #214d3e;

    border-radius:12px;

    overflow:hidden;
}

.panel-head{
    padding:9px 10px;

    display:flex;
    justify-content:space-between;

    border-bottom:1px solid #214d3e;

    font-size:11px;
    font-weight:bold;
}

.panel-head span{
    color:#d9bd61;
}

/* =====================================================
   AUCTION
===================================================== */

.auction{
    padding:7px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:4px;

    max-height:120px;

    overflow:auto;
}

.bid{
    min-height:34px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:#102f25;

    border:1px solid #315a4d;

    border-radius:6px;

    font-size:9px;
}

.bid b{
    color:#ebcc70;
    margin-top:2px;
}

/* =====================================================
   STATUS
===================================================== */

.status{
    padding:8px 10px;

    border-top:1px solid #214d3e;

    border-bottom:1px solid #214d3e;

    font-size:10px;

    line-height:1.5;

    text-align:center;
}

/* =====================================================
   BUTTONS
===================================================== */

.controls{
    padding:7px;

    display:grid;

    grid-template-columns:
        1fr 1fr 1.4fr;

    gap:5px;
}

.controls button{
    min-height:39px;

    border-radius:8px;

    border:1px solid #416b5d;

    background:#12382b;

    color:white;

    font-size:10px;

    font-weight:bold;
}

.controls .primary{
    background:
        linear-gradient(
            145deg,
            #d0a847,
            #947022
        );

    border-color:#ebce76;

    color:#111;
}

/* =====================================================
   BID MODAL
===================================================== */

.modal{
    position:fixed;

    inset:0;

    z-index:500;

    background:rgba(0,0,0,.76);

    display:none;

    align-items:flex-end;

    justify-content:center;
}

.modal.show{
    display:flex;
}

.dialog{
    width:100%;
    max-width:520px;

    background:#09241b;

    border-radius:
        16px 16px 0 0;

    border:1px solid #426f5f;

    padding:13px;

    box-shadow:
        0 -10px 35px rgba(0,0,0,.65);

    max-height:80vh;

    overflow:auto;
}

.dialog h2{
    margin:2px 0 12px;

    font-size:15px;

    text-align:center;
}

.bidgrid{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:5px;
}

.bidgrid button{
    min-height:43px;

    border-radius:7px;

    border:1px solid #466d60;

    background:#12392d;

    color:white;

    font-size:11px;

    font-weight:bold;
}

.bidgrid button:disabled{
    opacity:.28;
}

.close{
    width:100%;

    margin-top:9px;

    min-height:40px;

    border:0;

    border-radius:8px;

    background:#c39a3e;

    color:#111;

    font-weight:bold;
}

/* =====================================================
   RESULT
===================================================== */

.result-card{
    text-align:center;

    padding:8px;

    line-height:1.7;

    font-size:12px;
}

.result-score{
    font-size:28px;

    color:#efd273;

    font-weight:bold;

    margin:8px 0;
}

/* =====================================================
   FOOTER
===================================================== */

.footer{
    padding:12px;

    text-align:center;

    color:#7e9b91;

    font-size:9px;
}

/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width:380px){

    .table{
        height:540px;
    }

    .card{
        width:38px;
        height:56px;
    }

    .played{
        width:40px;
        height:57px;
    }

    .symbol{
        font-size:18px;
    }

    .center-info{
        width:140px;
        font-size:9px;
    }

}

/* =====================================================
   LANDSCAPE WARNING
===================================================== */

@media(
    orientation:landscape
) and (max-height:500px){

    body:before{
        content:
        "Untuk pengalaman terbaik, gunakan HP dalam posisi PORTRAIT.";

        position:fixed;

        z-index:9999;

        inset:0;

        display:flex;

        align-items:center;

        justify-content:center;

        text-align:center;

        padding:30px;

        background:#061812;

        color:white;

        font-size:16px;

        font-weight:bold;
    }

}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo">♠</div>

    <div class="title">
        <strong>GABSI KOTA TANJUNGBALAI</strong>
        <span>BRIDGE ONLINE • COMPUTER TABLE</span>
    </div>

    <button
        class="newgame"
        onclick="newGame()">
        GAME BARU
    </button>

</header>


<!-- =====================================================
     BOARD INFORMATION
===================================================== -->

<div class="boardbar">

    <div>
        BOARD <b id="boardNumber">1</b>
    </div>

    <div>
        Dealer:
        <b id="dealerText">N</b>
    </div>

    <div
        class="turn"
        id="turnText">
        LELANG
    </div>

</div>


<!-- =====================================================
     BRIDGE TABLE
===================================================== -->

<section class="table" id="table">


    <!-- NORTH -->

    <div class="player north">

        <div
            class="player-name"
            id="northName">
            NORTH • COMPUTER
        </div>

        <div
            class="hand vertical"
            id="northHand">
        </div>

    </div>


    <!-- WEST -->

    <div class="player west">

        <div
            class="player-name"
            id="westName">
            WEST • COMPUTER
        </div>

        <div
            class="hand vertical"
            id="westHand">
        </div>

    </div>


    <!-- EAST -->

    <div class="player east">

        <div
            class="player-name"
            id="eastName">
            EAST • COMPUTER
        </div>

        <div
            class="hand vertical"
            id="eastHand">
        </div>

    </div>


    <!-- SOUTH -->

    <div class="player south">

        <div
            class="hand"
            id="southHand">
        </div>

        <div
            class="player-name you">
            SOUTH • ANDA
        </div>

    </div>


    <!-- CENTER -->

    <div
        class="center-info"
        id="centerInfo">

        <strong>GABSI</strong>

        <span id="contractInfo">
            Lelang dimulai
        </span>

        <br>

        <span id="trickInfo">
            Trick 0 / 13
        </span>

    </div>


    <!-- CURRENT TRICK -->

    <div
        id="playedCards">
    </div>

</section>


<!-- =====================================================
     AUCTION / SCORE PANEL
===================================================== -->

<section class="panel">

    <div class="panel-head">

        <span>
            LELANG
        </span>

        <span id="scoreInfo">
            NS 0 — EW 0
        </span>

    </div>


    <div
        class="auction"
        id="auction">
    </div>


    <div
        class="status"
        id="status">
        Memulai permainan...
    </div>


    <div class="controls">

        <button
            onclick="sortHand()">
            URUTKAN
        </button>

        <button
            onclick="showHelp()">
            BANTUAN
        </button>

        <button
            class="primary"
            id="bidButton"
            onclick="openBid()">
            PILIH BID
        </button>

    </div>

</section>


<div class="footer">
    GABSI Kota Tanjungbalai • Bridge Practice
    • Portrait Mobile Edition
</div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    class="modal"
    id="modal">

    <div class="dialog">

        <h2 id="modalTitle">
            LELANG
        </h2>

        <div id="modalBody"></div>

        <button
            class="close"
            onclick="closeModal()">
            TUTUP
        </button>

    </div>

</div>


<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const SUITS = [
    "♣",
    "♦",
    "♥",
    "♠"
];

const RANKS = [
    "2","3","4","5","6","7",
    "8","9","T","J","Q","K","A"
];

const SEATS = [
    "N",
    "E",
    "S",
    "W"
];

const NAMES = {
    N:"North",
    E:"East",
    S:"South",
    W:"West"
};


/* =====================================================
   STATE
===================================================== */

let players = {
    N:[],
    E:[],
    S:[],
    W:[]
};

let deck = [];

let auction = [];

let phase = "auction";

let dealer = "N";

let turn = 0;

let lastBid = null;

let contract = null;

let declarer = null;

let dummy = null;

let leadSuit = null;

let currentTrick = [];

let trickNo = 0;

let tricksWon = {
    N:0,
    E:0,
    S:0,
    W:0
};

let boardNo = 1;


/* =====================================================
   START GAME
===================================================== */

function newGame(){

    boardNo =
        Math.floor(
            Math.random()*16
        ) + 1;

    dealer =
        SEATS[
            (boardNo-1)%4
        ];

    players = {
        N:[],
        E:[],
        S:[],
        W:[]
    };

    auction = [];

    phase = "auction";

    turn =
        SEATS.indexOf(
            dealer
        );

    lastBid = null;

    contract = null;

    declarer = null;

    dummy = null;

    leadSuit = null;

    currentTrick = [];

    trickNo = 0;

    tricksWon = {
        N:0,
        E:0,
        S:0,
        W:0
    };

    createDeck();

    dealCards();

    render();

    logMessage(
        "Board baru. Dealer " +
        NAMES[dealer]
    );

    if(
        SEATS[turn] !== "S"
    ){

        setTimeout(
            computerBid,
            700
        );

    }

}


/* =====================================================
   CREATE DECK
===================================================== */

function createDeck(){

    deck = [];

    for(
        const s of SUITS
    ){

        for(
            const r of RANKS
        ){

            deck.push({
                s:s,
                r:r
            });

        }

    }

    shuffle(
        deck
    );

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(arr){

    for(
        let i=arr.length-1;
        i>0;
        i--
    ){

        let j =
            Math.floor(
                Math.random()*(i+1)
            );

        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }

}


/* =====================================================
   DEAL
===================================================== */

function dealCards(){

    for(
        let i=0;
        i<52;
        i++
    ){

        players[
            SEATS[i%4]
        ].push(
            deck[i]
        );

    }

    for(
        const p of SEATS
    ){

        players[p].sort(
            cardCompare
        );

    }

}


/* =====================================================
   CARD SORT
===================================================== */

function cardCompare(a,b){

    let sa =
        SUITS.indexOf(
            a.s
        );

    let sb =
        SUITS.indexOf(
            b.s
        );

    return (
        sa-sb ||
        RANKS.indexOf(a.r) -
        RANKS.indexOf(b.r)
    );

}


/* =====================================================
   HCP
===================================================== */

function getHCP(hand){

    return hand.reduce(
        (total,c) => {

            const values = {
                A:4,
                K:3,
                Q:2,
                J:1
            };

            return total +
                (
                    values[c.r] || 0
                );

        },
        0
    );

}


/* =====================================================
   SUIT LENGTH
===================================================== */

function suitLength(
    hand,
    suit
){

    return hand.filter(
        c => c.s === suit
    ).length;

}


/* =====================================================
   BID ORDER
===================================================== */

function bidIndex(
    level,
    suit
){

    const denominations = [
        "♣",
        "♦",
        "♥",
        "♠",
        "NT"
    ];

    return (
        (level-1)*5 +
        denominations.indexOf(
            suit
        )
    );

}


/* =====================================================
   VALID BID
===================================================== */

function validBid(
    level,
    suit
){

    if(!lastBid)
        return true;

    return (
        bidIndex(
            level,
            suit
        ) >
        bidIndex(
            lastBid.level,
            lastBid.s
        )
    );

}


/* =====================================================
   BID TEXT
===================================================== */

function bidText(b){

    if(
        !b ||
        b.type === "pass"
    ){

        return "PASS";

    }

    return (
        b.level +
        " " +
        b.s
    );

}


/* =====================================================
   USER BID
===================================================== */

function userBid(
    level,
    suit
){

    if(
        phase !== "auction" ||
        SEATS[turn] !== "S"
    )
        return;


    if(
        level === 0
    ){

        auction.push({
            who:"S",
            type:"pass"
        });

        nextBidTurn();

        return;

    }


    if(
        !validBid(
            level,
            suit
        )
    )
        return;


    const bid = {
        who:"S",
        type:"bid",
        level:level,
        s:suit
    };

    auction.push(
        bid
    );

    lastBid = bid;

    nextBidTurn();

}


/* =====================================================
   NEXT BID
===================================================== */

function nextBidTurn(){

    turn =
        (turn+1)%4;


    /*
       3 PASS setelah ada bid
       = auction selesai.
    */

    const passes =
        countTrailingPasses();


    if(
        lastBid &&
        passes >= 3
    ){

        finishAuction();

        return;

    }


    /*
       4 PASS = passed out.
    */

    if(
        !lastBid &&
        auction.length >= 4
    ){

        logMessage(
            "Semua pemain PASS."
        );

        setTimeout(
            newGame,
            1000
        );

        return;

    }


    render();


    if(
        SEATS[turn] !== "S"
    ){

        setTimeout(
            computerBid,
            650
        );

    }

}


/* =====================================================
   TRAILING PASS
===================================================== */

function countTrailingPasses(){

    let count = 0;

    for(
        let i=auction.length-1;
        i>=0;
        i--
    ){

        if(
            auction[i].type === "pass"
        ){

            count++;

        }
        else{

            break;

        }

    }

    return count;

}


/* =====================================================
   COMPUTER BIDDING
===================================================== */

function computerBid(){

    if(
        phase !== "auction" ||
        SEATS[turn] === "S"
    )
        return;


    const p =
        SEATS[turn];

    const hand =
        players[p];

    const points =
        getHCP(hand);


    let longestSuit =
        SUITS[0];

    let longest =
        suitLength(
            hand,
            longestSuit
        );


    for(
        const s of SUITS
    ){

        let n =
            suitLength(
                hand,
                s
            );

        if(n > longest){

            longest = n;
            longestSuit = s;

        }

    }


    let chosen = null;


    /*
       Pembukaan sederhana:
       15-17 HCP -> 1NT
       13+ HCP -> suit terpanjang
    */

    if(!lastBid){

        if(
            points >= 15 &&
            points <= 17
        ){

            chosen = {
                level:1,
                s:"NT"
            };

        }
        else if(
            points >= 13
        ){

            chosen = {
                level:1,
                s:longestSuit
            };

        }

    }
    else{

        /*
           Jika memiliki 12+ HCP,
           komputer mencoba bid lanjutan.
        */

        if(
            points >= 12 &&
            lastBid.level < 4
        ){

            if(
                longest >= 5 &&
                validBid(
                    lastBid.level,
                    longestSuit
                )
            ){

                chosen = {
                    level:
                        lastBid.level,
                    s:
                        longestSuit
                };

            }

        }

    }


    if(
        !chosen ||
        !validBid(
            chosen.level,
            chosen.s
        )
    ){

        auction.push({
            who:p,
            type:"pass"
        });

        nextBidTurn();

        return;

    }


    chosen.who = p;
    chosen.type = "bid";

    auction.push(
        chosen
    );

    lastBid = chosen;

    nextBidTurn();

}


/* =====================================================
   FINISH AUCTION
===================================================== */

function finishAuction(){

    phase = "play";


    /*
       Declarer adalah pemain pertama
       yang melakukan bid denomination
       terakhir.
    */

    for(
        const a of auction
    ){

        if(
            a.type === "bid" &&
            a.s === lastBid.s
        ){

            declarer =
                a.who;

            break;

        }

    }


    dummy =
        SEATS[
            (
                SEATS.indexOf(
                    declarer
                ) + 2
            ) % 4
        ];


    contract = {
        level:lastBid.level,
        s:lastBid.s
    };


    /*
       Opening lead dari pemain
       di sebelah kiri declarer.
    */

    turn =
        (
            SEATS.indexOf(
                declarer
            ) + 3
        ) % 4;


    logMessage(
        "Kontrak " +
        bidText(contract) +
        " • Declarer " +
        NAMES[declarer]
    );


    render();


    if(
        SEATS[turn] !== "S"
    ){

        setTimeout(
            computerPlay,
            700
        );

    }

}


/* =====================================================
   LEGAL CARDS
===================================================== */

function legalCards(p){

    const hand =
        players[p];


    if(
        !leadSuit
    ){

        return hand;

    }


    const follow =
        hand.filter(
            c =>
                c.s === leadSuit
        );


    return (
        follow.length
        ? follow
        : hand
    );

}


/* =====================================================
   PLAY
===================================================== */

function playCard(
    player,
    card
){

    if(
        phase !== "play"
    )
        return;


    if(
        SEATS[turn] !== player
    )
        return;


    const legal =
        legalCards(
            player
        );


    const allowed =
        legal.some(
            c =>
                c.s === card.s &&
                c.r === card.r
        );


    if(!allowed)
        return;


    const index =
        players[player].findIndex(
            c =>
                c.s === card.s &&
                c.r === card.r
        );


    if(index < 0)
        return;


    players[player].splice(
        index,
        1
    );


    currentTrick.push({
        player:player,
        card:card
    });


    if(!leadSuit){

        leadSuit =
            card.s;

    }


    render();


    if(
        currentTrick.length === 4
    ){

        setTimeout(
            resolveTrick,
            700
        );

        return;

    }


    turn =
        (turn+1)%4;


    render();


    if(
        SEATS[turn] !== "S"
    ){

        setTimeout(
            computerPlay,
            550
        );

    }

}


/* =====================================================
   TRUMP
===================================================== */

function getTrump(){

    if(
        !contract ||
        contract.s === "NT"
    ){

        return null;

    }

    return contract.s;

}


/* =====================================================
   CARD WINNER
===================================================== */

function cardBeats(
    a,
    b
){

    if(!b)
        return true;


    const trump =
        getTrump();


    /*
       Trump wins.
    */

    if(
        trump &&
        a.s === trump &&
        b.s !== trump
    ){

        return true;

    }


    if(
        trump &&
        a.s !== trump &&
        b.s === trump
    ){

        return false;

    }


    /*
       Different suit:
       only lead suit can win.
    */

    if(
        a.s !== b.s
    ){

        return false;

    }


    return (
        RANKS.indexOf(a.r) >
        RANKS.indexOf(b.r)
    );

}


/* =====================================================
   TRICK WINNER
===================================================== */

function getTrickWinner(){

    let winner =
        currentTrick[0];


    for(
        let i=1;
        i<currentTrick.length;
        i++
    ){

        if(
            cardBeats(
                currentTrick[i].card,
                winner.card
            )
        ){

            winner =
                currentTrick[i];

        }

    }


    return winner;

}


/* =====================================================
   COMPUTER PLAY
===================================================== */

function computerPlay(){

    if(
        phase !== "play"
    )
        return;


    const player =
        SEATS[turn];


    if(
        player === "S"
    )
        return;


    const legal =
        legalCards(
            player
        );


    let selected;


    /*
       Jika lead:
       gunakan kartu rendah/
       menengah dari suit panjang.
    */

    if(
        currentTrick.length === 0
    ){

        selected =
            [...legal].sort(
                (a,b) =>
                    RANKS.indexOf(a.r) -
                    RANKS.indexOf(b.r)
            )[0];

    }
    else{

        const winner =
            getTrickWinner();


        const winning =
            legal.filter(
                c =>
                    cardBeats(
                        c,
                        winner.card
                    )
            );


        if(
            winning.length
        ){

            /*
               Menang dengan
               kartu paling murah.
            */

            selected =
                [...winning].sort(
                    (a,b) =>
                        RANKS.indexOf(a.r) -
                        RANKS.indexOf(b.r)
                )[0];

        }
        else{

            /*
               Tidak bisa menang:
               buang kartu rendah.
            */

            selected =
                [...legal].sort(
                    (a,b) =>
                        RANKS.indexOf(a.r) -
                        RANKS.indexOf(b.r)
                )[0];

        }

    }


    playCard(
        player,
        selected
    );

}


/* =====================================================
   RESOLVE TRICK
===================================================== */

function resolveTrick(){

    const winner =
        getTrickWinner();


    tricksWon[
        winner.player
    ]++;


    logMessage(
        "Trick " +
        (trickNo+1) +
        " dimenangkan " +
        NAMES[
            winner.player
        ]
    );


    trickNo++;


    /*
       Pemenang trick
       menjadi leader berikutnya.
    */

    turn =
        SEATS.indexOf(
            winner.player
        );


    currentTrick = [];

    leadSuit = null;


    if(
        trickNo >= 13
    ){

        finishBoard();

        return;

    }


    render();


    if(
        SEATS[turn] !== "S"
    ){

        setTimeout(
            computerPlay,
            650
        );

    }

}


/* =====================================================
   SCORE
===================================================== */

function calculateScore(){

    const declarerNS =
        (
            declarer === "N" ||
            declarer === "S"
        );


    const declarerTricks =
        declarerNS
        ?
        tricksWon.N +
        tricksWon.S
        :
        tricksWon.E +
        tricksWon.W;


    const target =
        6 +
        contract.level;


    const difference =
        declarerTricks -
        target;


    if(
        difference < 0
    ){

        return {
            score:
                -50 *
                Math.abs(
                    difference
                ),

            made:
                declarerTricks,

            target:
                target,

            difference:
                difference
        };

    }


    let trickValue;


    if(
        contract.s === "♣" ||
        contract.s === "♦"
    ){

        trickValue =
            20;

    }
    else if(
        contract.s === "♥" ||
        contract.s === "♠"
    ){

        trickValue =
            30;

    }
    else{

        trickValue =
            30;

    }


    let score =
        contract.level *
        trickValue;


    if(
        contract.s === "NT"
    ){

        score += 10;

    }


    score += 50;


    if(
        contract.level >= 4
    ){

        score +=
            (
                contract.level-3
            ) * 20;

    }


    return {
        score:score,
        made:declarerTricks,
        target:target,
        difference:difference
    };

}


/* =====================================================
   FINISH BOARD
===================================================== */

function finishBoard(){

    phase = "done";


    const result =
        calculateScore();


    logMessage(
        "Board selesai • " +
        result.made +
        "/" +
        result.target +
        " trick"
    );


    render();


    setTimeout(
        showResult,
        500
    );

}

        phase === "play" &&

    el.innerHTML = `

        <div class="symbol">

        </div>

    el.onclick =

    return el;

}

/* =====================================================
   BID WINDOW
===================================================== */

function openBid(){

    if(
        phase !== "auction" ||
        SEATS[turn] !== "S"
    )
        return;


    const modal =
        document.getElementById(
            "modal"
        );


    const body =
        document.getElementById(
            "modalBody"
        );


    body.innerHTML = "";


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "bidgrid";


    /*
       PASS
    */

    const pass =
        document.createElement(
            "button"
        );


    pass.textContent =
        "PASS";


    pass.onclick =
        () => {

            closeModal();

            userBid(
                0,
                ""
            );

        };


    grid.appendChild(
        pass
    );


    /*
       1C - 7NT
    */

    for(
        let level=1;
        level<=7;
        level++
    ){

        for(
            const suit of [
                "♣",
                "♦",
                "♥",
                "♠",
                "NT"
            ]
        ){

            const button =
                document.createElement(
                    "button"
                );


            button.textContent =
                level +
                suit;


            button.disabled =
                !validBid(
                    level,
                    suit
                );


            button.onclick =
                () => {

                    closeModal();

                    userBid(
                        level,
                        suit
                    );

                };


            grid.appendChild(
                button
            );

        }

    }


    body.appendChild(
        grid
    );


    document
        .getElementById(
            "modalTitle"
        )
        .textContent =
            "PILIH BID";


    modal.classList.add(
        "show"
    );

}
