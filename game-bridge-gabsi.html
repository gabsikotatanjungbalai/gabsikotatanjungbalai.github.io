<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082b20">
<meta name="description" content="GABSI Kota Tanjungbalai - Game Bridge melawan komputer">
<title>Game Bridge — GABSI Kota Tanjungbalai</title>

<style>
:root{
  --bg:#071713;
  --felt:#0b5b3c;
  --felt2:#08452f;
  --panel:#09241c;
  --gold:#e7c66a;
  --white:#f7f7f3;
  --muted:#a9c1b8;
  --red:#c83b3b;
  --cardw:56px;
  --cardh:78px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 20%,#146b49 0,#062018 58%,#03110d 100%);
  color:var(--white);
}

button{
  font:inherit;
}

.app{
  max-width:1100px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.top{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  background:rgba(3,16,12,.96);
  border-bottom:1px solid #1e4b3c;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  width:42px;
  height:42px;
  border-radius:10px;
  background:linear-gradient(145deg,#e9ca6b,#9c7421);
  color:#082015;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:22px;
}

.brand b{
  display:block;
  font-size:15px;
}

.brand small{
  color:var(--muted);
}

.spacer{
  flex:1;
}

.top button,
.actions button{
  border:1px solid #396d5a;
  background:#102e25;
  color:white;
  border-radius:9px;
  padding:9px 12px;
}

/* LAYOUT */
.board{
  margin:10px;
  display:grid;
  grid-template-columns:1fr 250px;
  gap:10px;
}

/* TABLE */
.table{
  position:relative;
  min-height:650px;
  border:2px solid #195b42;
  border-radius:20px;
  background:
    radial-gradient(
      ellipse at center,
      #0d7049,
      #075438 60%,
      #043324
    );
  box-shadow:
    inset 0 0 50px #021b12,
    0 8px 30px #0008;
  overflow:hidden;
}

.table:before{
  content:"GABSI";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#fff1;
  font-size:90px;
  font-weight:900;
  letter-spacing:8px;
  transform:rotate(-12deg);
}

/* SEATS */
.seat{
  position:absolute;
  z-index:6;
  text-align:center;
}

.north{
  top:8px;
  left:50%;
  transform:translateX(-50%);
}

.south{
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
}

.west{
  left:7px;
  top:50%;
  transform:translateY(-50%);
}

.east{
  right:7px;
  top:50%;
  transform:translateY(-50%);
}

.name{
  font-size:12px;
  font-weight:bold;
  background:#061912dd;
  border:1px solid #396d5a;
  border-radius:8px;
  padding:5px 8px;
  display:inline-block;
}

.you{
  color:var(--gold);
}

/* BOARD INFO */
.info{
  position:absolute;
  top:9px;
  left:50%;
  transform:translateX(-50%);
  z-index:8;
  background:#071b15dd;
  border:1px solid #467c69;
  border-radius:9px;
  padding:6px 10px;
  text-align:center;
  white-space:nowrap;
  font-size:12px;
}

/* CARDS */
.hand{
  display:flex;
  justify-content:center;
  min-height:80px;
}

.sidehand{
  flex-direction:column;
  align-items:center;
}

.sidehand .card{
  margin:-17px 0;
}

.sidehand .card:first-child{
  margin-top:0;
}

.sidehand .card:last-child{
  margin-bottom:0;
}

.card{
  width:var(--cardw);
  height:var(--cardh);
  background:linear-gradient(145deg,#fff,#e8e8e4);
  color:#111;
  border-radius:7px;
  border:1px solid #aaa;
  box-shadow:0 2px 5px #0008;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:5px;
  cursor:pointer;
  user-select:none;
  transition:.12s;
  position:relative;
}

.card:hover{
  transform:translateY(-8px);
  z-index:10;
}

.card.red{
  color:#c52e2e;
}

.card .corner{
  font-weight:800;
  line-height:1.05;
}

.card .pip{
  font-size:25px;
  text-align:center;
  align-self:center;
}

.back{
  background:
    repeating-linear-gradient(
      45deg,
      #174c87 0 4px,
      #dbe6f5 4px 7px
    );
  color:white;
  border:3px solid #eee;
  cursor:default;
}

.dummy .card{
  cursor:default;
}

.dummy .card:hover{
  transform:none;
}

/* PLAYED CARDS */
.trick{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:4;
}

.played{
  position:absolute;
  width:60px;
  height:82px;
}

.played.n{
  top:35%;
  left:50%;
  transform:translate(-50%,-50%);
}

.played.s{
  bottom:34%;
  left:50%;
  transform:translate(-50%,50%);
}

.played.w{
  left:38%;
  top:50%;
  transform:translate(-50%,-50%);
}

.played.e{
  right:38%;
  top:50%;
  transform:translate(50%,-50%);
}

/* SIDE PANEL */
.side{
  background:rgba(4,20,15,.94);
  border:1px solid #244f41;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  max-height:650px;
}

.side h3{
  margin:0;
  padding:12px;
  border-bottom:1px solid #244f41;
  font-size:14px;
}

.auction{
  padding:8px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  max-height:220px;
  overflow:auto;
}

.bid{
  background:#102f26;
  border:1px solid #315e50;
  border-radius:6px;
  padding:5px;
  text-align:center;
  font-size:11px;
}

.bid b{
  display:block;
  color:var(--gold);
}

.status{
  padding:10px;
  border-top:1px solid #244f41;
  border-bottom:1px solid #244f41;
  font-size:12px;
  line-height:1.5;
}

.log{
  padding:9px;
  overflow:auto;
  flex:1;
  font-size:11px;
  color:#c7d9d2;
}

.log div{
  padding:3px 0;
  border-bottom:1px solid #173a30;
}

/* CONTROLS */
.controls{
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  background:#061812;
}

.controls button{
  flex:1;
  min-width:90px;
  background:#12382c;
  border:1px solid #39705d;
  color:white;
  border-radius:8px;
  padding:9px;
}

.controls button.primary{
  background:#a47b28;
  border-color:#e2c66c;
  color:#10150e;
  font-weight:bold;
}

/* FOOTER */
.bottom{
  padding:10px;
  text-align:center;
  color:#91aaa1;
  font-size:11px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  place-items:center;
  z-index:100;
  padding:18px;
}

.modal.show{
  display:grid;
}

.dialog{
  width:min(520px,100%);
  background:#09241c;
  border:1px solid #487565;
  border-radius:15px;
  box-shadow:0 20px 60px #000;
  padding:16px;
}

.dialog h2{
  margin-top:0;
}

.bidgrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
}

.bidgrid button{
  padding:10px 3px;
  border-radius:7px;
  background:#123a2d;
  color:#fff;
  border:1px solid #477464;
}

.bidgrid button:disabled{
  opacity:.35;
}

.close{
  margin-top:12px;
  width:100%;
  padding:10px;
  border:0;
  border-radius:8px;
  background:#b78a31;
  color:#111;
  font-weight:bold;
}

/* MOBILE */
@media(max-width:780px){

  .board{
    grid-template-columns:1fr;
  }

  .side{
    max-height:none;
  }

  .table{
    min-height:590px;
  }

  .side{
    order:2;
  }

  :root{
    --cardw:49px;
    --cardh:70px;
  }

  .card .pip{
    font-size:21px;
  }

  .west{
    left:2px;
  }

  .east{
    right:2px;
  }

  .played.w{
    left:34%;
  }

  .played.e{
    right:34%;
  }
}

@media(max-width:430px){

  :root{
    --cardw:43px;
    --cardh:63px;
  }

  .table{
    min-height:555px;
  }

  .name{
    font-size:10px;
    padding:4px 6px;
  }

  .hand{
    min-height:65px;
  }

  .info{
    font-size:10px;
  }

  .brand small{
    font-size:9px;
  }

  .top button{
    padding:7px 8px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">

  <div class="logo">♠</div>

  <div class="brand">
    <b>GABSI KOTA TANJUNGBALAI</b>
    <small>BRIDGE ONLINE • VS COMPUTER</small>
  </div>

  <div class="spacer"></div>

  <button onclick="newGame()">↻ Game Baru</button>

</header>


<main class="board">

<section class="table" id="table">

  <div class="info" id="boardInfo">
    Board 1 • Dealer: N • Semua aman
  </div>


  <!-- NORTH -->

  <div class="seat north">

    <div class="name" id="nameN">
      North • Komputer
    </div>

    <div class="hand sidehand" id="handN"></div>

  </div>


  <!-- WEST -->

  <div class="seat west">

    <div class="name" id="nameW">
      West • Komputer
    </div>

    <div class="hand sidehand" id="handW"></div>

  </div>


  <!-- EAST -->

  <div class="seat east">

    <div class="name" id="nameE">
      East • Komputer
    </div>

    <div class="hand sidehand" id="handE"></div>

  </div>


  <!-- SOUTH / USER -->

  <div class="seat south">

    <div class="name you" id="nameS">
      South • ANDA
    </div>

    <div class="hand" id="handS"></div>

  </div>


  <div class="trick" id="trick"></div>

</section>


<!-- PANEL KANAN -->

<aside class="side">

  <h3>
    LELANG / AUCTION
  </h3>

  <div class="auction" id="auction"></div>


  <div class="status" id="status">
    Memulai permainan...
  </div>


  <div class="log" id="log"></div>


  <div class="controls">

    <button onclick="sortHand()">
      Urutkan
    </button>

    <button onclick="showHelp()">
      Bantuan
    </button>

    <button
      class="primary"
      onclick="openBid()"
      id="bidBtn">
      Pilih Bid
    </button>

  </div>

</aside>

</main>


<div class="bottom">
  Game Bridge GABSI • Single-file HTML • 4 pemain • AI komputer
</div>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="dialog">

    <h2 id="modalTitle">
      Lelang
    </h2>

    <div id="modalBody"></div>

    <button
      class="close"
      onclick="closeModal()">
      Tutup
    </button>

  </div>

</div>


<script>

/* =========================================================
   DATA DASAR
========================================================= */

const SUITS = ['♣','♦','♥','♠'];

const RANKS = [
  '2','3','4','5','6','7',
  '8','9','T','J','Q','K','A'
];

const SEATS = ['N','E','S','W'];

const NAMES = {
  N:'North',
  E:'East',
  S:'South',
  W:'West'
};


/* =========================================================
   STATE GAME
========================================================= */

let players = {
  N:[],
  E:[],
  S:[],
  W:[]
};

let deck = [];

let auction = [];

let phase = 'auction';

let dealer = 'N';

let turn = 0;

let contract = null;

let declarer = null;

let dummy = null;

let leadSuit = null;

let trick = [];

let trickNo = 0;

let tricksWon = {
  N:0,
  E:0,
  S:0,
  W:0
};

let boardNo = 1;

let passCount = 0;

let lastBid = null;


/* =========================================================
   GAME BARU
========================================================= */

function newGame(){

  boardNo =
    Math.floor(Math.random()*16)+1;

  dealer =
    SEATS[(boardNo-1)%4];

  players = {
    N:[],
    E:[],
    S:[],
    W:[]
  };

  auction = [];

  phase = 'auction';

  turn = SEATS.indexOf(dealer);

  contract = null;

  declarer = null;

  dummy = null;

  leadSuit = null;

  trick = [];

  trickNo = 0;

  tricksWon = {
    N:0,
    E:0,
    S:0,
    W:0
  };

  passCount = 0;

  lastBid = null;

  makeDeck();

  deal();

  render();

  log(
    'Board baru dibagikan. Dealer: ' +
    NAMES[dealer] + '.'
  );

  if(SEATS[turn] !== 'S'){

    setTimeout(
      computerBid,
      700
    );

  }

}


/* =========================================================
   DECK
========================================================= */

function makeDeck(){

  deck = [];

  for(const s of SUITS){

    for(const r of RANKS){

      deck.push({
        s:s,
        r:r
      });

    }

  }

  deck.sort(
    () => Math.random()-.5
  );

}


/* =========================================================
   DEAL
========================================================= */

function deal(){

  for(let i=0;i<52;i++){

    players[
      SEATS[i%4]
    ].push(deck[i]);

  }

  for(const p of SEATS){

    players[p].sort(cardCmp);

  }

}


/* =========================================================
   SORT
========================================================= */

function cardCmp(a,b){

  let si =
    SUITS.indexOf(a.s);

  let sj =
    SUITS.indexOf(b.s);

  return (
    si-sj ||
    RANKS.indexOf(a.r) -
    RANKS.indexOf(b.r)
  );

}


/* =========================================================
   HCP
========================================================= */

function hcp(hand){

  return hand.reduce(
    (n,c) =>
      n +
      ({
        A:4,
        K:3,
        Q:2,
        J:1
      }[c.r] || 0),
    0
  );

}


/* =========================================================
   BID INDEX
========================================================= */

function canBid(level,suit){

  if(!lastBid)
    return true;

  let idx =
    (level-1)*5 +
    SUITS.indexOf(suit);

  let old =
    (lastBid.level-1)*5 +
    SUITS.indexOf(lastBid.s);

  return idx > old;

}


/* =========================================================
   BID TEXT
========================================================= */

function bidText(b){

  if(b.type === 'pass')
    return 'PASS';

  return (
    b.level +
    ' ' +
    b.s
  );

}


/* =========================================================
   USER BID
========================================================= */

function bid(level,suit){

  if(
    phase !== 'auction' ||
    SEATS[turn] !== 'S'
  )
    return;


  if(level === 0){

    auction.push({
      who:'S',
      type:'pass'
    });

    passCount++;

    advanceAuction();

    return;

  }


  if(!canBid(level,suit))
    return;


  auction.push({
    who:'S',
    type:'bid',
    level:level,
    s:suit
  });

  lastBid = {
    level:level,
    s:suit
  };

  passCount = 0;

  advanceAuction();

}


/* =========================================================
   NEXT AUCTION
========================================================= */

function advanceAuction(){

  turn =
    (turn+1)%4;


  if(
    passCount >= 3 &&
    lastBid
  ){

    finishAuction();

    return;

  }


  if(
    passCount >= 4 &&
    !lastBid
  ){

    log(
      'Semua PASS — board dibagikan ulang.'
    );

    setTimeout(
      newGame,
      1200
    );

    return;

  }


  render();


  if(
    SEATS[turn] !== 'S'
  ){

    setTimeout(
      computerBid,
      650
    );

  }

}


/* =========================================================
   AI BIDDING
========================================================= */

function computerBid(){

  if(
    phase !== 'auction' ||
    SEATS[turn] === 'S'
  )
    return;


  const p = SEATS[turn];

  const hand =
    players[p];

  const pts =
    hcp(hand);

  const suits =
    SUITS
      .map(
        s => [
          s,
          hand.filter(
            c => c.s === s
          ).length
        ]
      )
      .sort(
        (a,b) => b[1]-a[1]
      );


  let chosen = null;


  /*
    Sistem AI sederhana:
    - 15-17 HCP bisa membuka 1NT
    - 13+ HCP membuka suit terpanjang
    - tangan kuat melakukan raise
  */

  if(!lastBid){

    if(
      pts >= 15 &&
      pts <= 17
    ){

      chosen = {
        level:1,
        s:'NT'
      };

    }
    else if(pts >= 13){

      chosen = {
        level:1,
        s:suits[0][0]
      };

    }

  }
  else if(
    pts >= 12 &&
    lastBid.level < 4
  ){

    let s =
      suits[0][0];

    if(
      suits[0][1] >= 5 &&
      canBid(
        lastBid.level,
        s
      )
    ){

      chosen = {
        level:lastBid.level,
        s:s
      };

    }
    else if(
      pts >= 15
    ){

      chosen = {
        level:1,
        s:'NT'
      };

    }

  }


  if(
    chosen &&
    chosen.s !== 'NT' &&
    !canBid(
      chosen.level,
      chosen.s
    )
  ){

    chosen = null;

  }


  if(!chosen){

    auction.push({
      who:p,
      type:'pass'
    });

    passCount++;

    advanceAuction();

    return;

  }


  auction.push({
    who:p,
    type:'bid',
    level:chosen.level,
    s:chosen.s
  });

  lastBid = chosen;

  passCount = 0;

  advanceAuction();

}


/* =========================================================
   SELESAI LELANG
========================================================= */

function finishAuction(){

  phase = 'play';


  /*
    Declarer:
    pemain pertama yang menyebut
    denomination kontrak terakhir.
  */

  let final =
    lastBid;

  let first = null;


  for(const a of auction){

    if(
      a.type === 'bid' &&
      a.s === final.s
    ){

      first = a.who;

      break;

    }

  }


  declarer = first;


  dummy =
    SEATS[
      (SEATS.indexOf(declarer)+2)%4
    ];


  contract = final;


  /*
    Opening lead:
    pemain di kiri declarer.
  */

  turn =
    (SEATS.indexOf(declarer)+3)%4;


  log(
    'Kontrak ' +
    final.level +
    ' ' +
    final.s +
    ' • Declarer ' +
    NAMES[declarer] +
    ' • Dummy ' +
    NAMES[dummy]
  );


  render();


  if(
    SEATS[turn] !== 'S'
  ){

    setTimeout(
      computerPlay,
      700
    );

  }

}


/* =========================================================
   LEGAL CARD
========================================================= */

function legalCards(p){

  const hand =
    players[p];

  if(!leadSuit)
    return hand;


  const follow =
    hand.filter(
      c => c.s === leadSuit
    );


  return follow.length
    ? follow
    : hand;

}


/* =========================================================
   PLAY CARD
========================================================= */

function playCard(p,card){

  if(
    phase !== 'play' ||
    SEATS[turn] !== p
  )
    return;


  const legal =
    legalCards(p);


  if(
    !legal.some(
      c =>
        c.s === card.s &&
        c.r === card.r
    )
  )
    return;


  const index =
    players[p].findIndex(
      c =>
        c.s === card.s &&
        c.r === card.r
    );


  players[p].splice(
    index,
    1
  );


  trick.push({
    p:p,
    card:card
  });


  if(!leadSuit)
    leadSuit = card.s;


  render();


  if(trick.length === 4){

    setTimeout(
      resolveTrick,
      550
    );

  }
  else{

    turn =
      (turn+1)%4;


    if(
      SEATS[turn] !== 'S'
    ){

      setTimeout(
        computerPlay,
        500
      );

    }

  }

}


/* =========================================================
   TRUMP
========================================================= */

function trump(){

  if(
    contract.s === 'NT'
  )
    return null;

  return contract.s;

}


/* =========================================================
   CARD COMPARISON
========================================================= */

function beats(a,b){

  if(!b)
    return true;


  const t =
    trump();


  /*
    Trump mengalahkan suit biasa.
  */

  if(
    t &&
    a.s === t &&
    b.s !== t
  )
    return true;


  if(
    t &&
    a.s !== t &&
    b.s === t
  )
    return false;


  /*
    Harus suit yang sama
  */

  if(
    a.s !== b.s
  )
    return false;


  return (
    RANKS.indexOf(a.r) >
    RANKS.indexOf(b.r)
  );

}


/* =========================================================
   WINNER
========================================================= */

function winningCard(){

  let win =
    trick[0];


  for(
    let i=1;
    i<trick.length;
    i++
  ){

    if(
      beats(
        trick[i].card,
        win.card
      )
    ){

      win =
        trick[i];

    }

  }


  return win;

}


/* =========================================================
   AI PLAY
========================================================= */

function computerPlay(){

  if(
    phase !== 'play' ||
    SEATS[turn] === 'S'
  )
    return;


  const p =
    SEATS[turn];


  const legal =
    legalCards(p);


  let c;


  if(trick.length){

    let best =
      winningCard();


    const winners =
      legal.filter(
        x =>
          beats(
            x,
            best.card
          )
      );


    if(winners.length){

      winners.sort(
        (a,b) =>
          RANKS.indexOf(a.r) -
          RANKS.indexOf(b.r)
      );

      c =
        winners[0];

    }
    else{

      c =
        [...legal].sort(
          (a,b) =>
            RANKS.indexOf(a.r) -
            RANKS.indexOf(b.r)
        )[0];

    }

  }
  else{

    c =
      leadChoice(legal);

  }


  playCard(
    p,
    c
  );

}


/* =========================================================
   AI LEAD
========================================================= */

function leadChoice(hand){

  return (
    [...hand].sort(
      (a,b) =>
        RANKS.indexOf(a.r) -
        RANKS.indexOf(b.r)
    )[Math.floor(hand.length/3)]
    ||
    hand[0]
  );

}


/* =========================================================
   TRICK SELESAI
========================================================= */

function resolveTrick(){

  const win =
    winningCard().p;


  tricksWon[win]++;


  log(
    'Trick ' +
    (trickNo+1) +
    ': ' +
    NAMES[win] +
    ' menang.'
  );


  trickNo++;


  trick = [];


  leadSuit = null;


  turn =
    SEATS.indexOf(win);


  if(
    trickNo >= 13
  ){

    finishBoard();

    return;

  }


  render();


  if(
    SEATS[turn] !== 'S'
  ){

    setTimeout(
      computerPlay,
      550
    );

  }

}


/* =========================================================
   SCORE
========================================================= */

function scoreContract(
  c,
  diff
){

  /*
    Perhitungan dasar:
    berhasil kontrak / down.
  */

  if(diff < 0){

    return -(
      50 * (-diff) +
      (c.level >= 4 ? 100 : 0)
    );

  }


  let base;


  if(c.s === 'NT'){

    base =
      40 +
      (c.level-1)*30;

  }
  else if(
    c.s === '♠' ||
    c.s === '♥'
  ){

    base =
      30*c.level;

  }
  else{

    base =
      20*c.level;

  }


  return (
    base +
    (c.s === 'NT' ? 10 : 0) +
    50 +
    Math.max(
      0,
      c.level-3
    )*20
  );

}


/* =========================================================
   BOARD SELESAI
========================================================= */

function finishBoard(){

  phase = 'done';


  let declarerSide =
    (
      declarer === 'N' ||
      declarer === 'S'
    )
    ? ['N','S']
    : ['E','W'];


  let made =
    tricksWon[
      declarerSide[0]
    ] +
    tricksWon[
      declarerSide[1]
    ];


  let target =
    6 +
    contract.level;


  let diff =
    made-target;


  let score =
    scoreContract(
      contract,
      diff
    );


  log(
    'SELESAI: ' +
    made +
    ' trick untuk pihak declarer. ' +
    (
      diff >= 0
      ? 'Kontrak berhasil.'
      : 'Kontrak down ' + (-diff) + '.'
    ) +
    ' Skor ' +
    score +
    '.'
  );


  render();


  setTimeout(
    () =>
      showResult(
        made,
        target,
        score
      ),
    350
  );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  document
    .getElementById(
      'boardInfo'
    )
    .textContent =
      `Board ${boardNo} • Dealer: ${NAMES[dealer]} • ` +
      (
        phase === 'auction'
        ? 'Lelang'
        : 'Kontrak ' +
          (
            contract
            ? bidText(contract)
            : ''
          )
      );


  renderHand('S');

  renderBack('N');

  renderBack('W');

  renderBack('E');

  renderTrick();

  renderAuction();


  const status =
    document.getElementById(
      'status'
    );


  if(
    phase === 'auction'
  ){

    status.innerHTML =
      `Giliran: <b>${NAMES[SEATS[turn]]}</b><br>` +
      `HCP Anda: <b>${hcp(players.S)}</b> • ` +
      `Kartu: ${players.S.length}`;

  }
  else if(
    phase === 'play'
  ){

    status.innerHTML =
      `Kontrak: <b>${bidText(contract)}</b><br>` +
      `Declarer: <b>${NAMES[declarer]}</b> • ` +
      `Dummy: <b>${NAMES[dummy]}</b><br>` +
      `Trick ${trickNo+1}/13 • ` +
      `Giliran: <b>${NAMES[SEATS[turn]]}</b>`;

  }
  else{

    status.innerHTML =
      `<b>Board selesai.</b><br>` +
      `Kontrak ${bidText(contract)}`;

  }


  document
    .getElementById(
      'bidBtn'
    )
    .disabled =
      !(
        phase === 'auction' &&
        SEATS[turn] === 'S'
      );

}


/* =========================================================
   RENDER HAND
========================================================= */

function renderHand(p){

  const el =
    document.getElementById(
      'hand'+p
    );


  el.innerHTML = '';


  players[p].forEach(
    c =>
      el.appendChild(
        cardEl(
          c,
          () => playCard(p,c)
        )
      )
  );

}


/* =========================================================
   RENDER BACK
========================================================= */

function renderBack(p){

  const el =
    document.getElementById(
      'hand'+p
    );


  el.innerHTML = '';


  const n =
    players[p].length;


  for(
    let i=0;
    i<n;
    i++
  ){

    let x =
      document.createElement(
        'div'
      );


    x.className =
      'card back';


    el.appendChild(x);

  }

}


/* =========================================================
   CARD ELEMENT
========================================================= */

function cardEl(c,fn){

  let x =
    document.createElement(
      'div'
    );


  x.className =
    'card ' +
    (
      c.s === '♥' ||
      c.s === '♦'
      ? 'red'
      : ''
    );


  x.innerHTML =
    `<span class="corner">
      ${c.r}<br>${c.s}
    </span>
    <span class="pip">
      ${c.s}
    </span>
    <span></span>`;


  x.onclick = fn;


  return x;

}


/* =========================================================
   TRICK DISPLAY
========================================================= */

function renderTrick(){

  const t =
    document.getElementById(
      'trick'
    );


  t.innerHTML = '';


  const pos = {
    N:'n',
    S:'s',
    W:'w',
    E:'e'
  };


  trick.forEach(
    x => {

      let d =
        cardEl(
          x.card,
          () => {}
        );


      d.classList.add(
        'played',
        pos[x.p]
      );


      t.appendChild(d);

    }
  );

}


/* =========================================================
   AUCTION DISPLAY
========================================================= */

function renderAuction(){

  const a =
    document.getElementById(
      'auction'
    );


  a.innerHTML = '';


  auction.forEach(
    x => {

      let d =
        document.createElement(
          'div'
        );


      d.className =
        'bid';


      d.innerHTML =
        `${NAMES[x.who]}
         <b>${bidText(x)}</b>`;


      a.appendChild(d);

    }

}


/* =========================================================
   BID MODAL
========================================================= */

function openBid(){

  if(
    phase !== 'auction' ||
    SEATS[turn] !== 'S'
  )
    return;


  let modal =
    document.getElementById(
      'modal'
    );


  let body =
    document.getElementById(
      'modalBody'
    );


  body.innerHTML = '';


  let grid =
    document.createElement(
      'div'
    );


  grid.className =
    'bidgrid';


  let pass =
    document.createElement(
      'button'
    );


  pass.textContent =
    'PASS';


  pass.onclick =
    () => {

      closeModal();

      bid(0,'');

    };


  grid.appendChild(pass);


  for(
    let l=1;
    l<=7;
    l++
  ){

    for(
      let s of [
        '♣',
        '♦',
        '♥',
        '♠',
        'NT'
      ]
    ){

      let bt =
        document.createElement(
          'button'
        );


      bt.textContent =
        l+' '+s;


      let disabled = false;


      if(
        s === 'NT'
      ){

        if(lastBid){

          disabled =
            (
              (l-1)*5+4
              <=
              (lastBid.level-1)*5+
              SUITS.indexOf(
                lastBid.s
              )
            );

        }

      }
      else{

        disabled =
          !canBid(
            l,
            s
          );

      }


      bt.disabled =
        disabled;


      bt.onclick =
        () => {

          closeModal();

          bid(
            l,
            s
          );

        };


      grid.appendChild(bt);

    }

  }


  body.appendChild(
    grid
  );


  document
    .getElementById(
      'modal'
    )
    .classList.add(
      'show'
    );

}

   RESULT
========================================================= */

}
