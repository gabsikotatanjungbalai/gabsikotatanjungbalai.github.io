<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#071712">
<title>GABSI Kota Tanjungbalai — Bridge Online</title>

<style>
:root{
  --bg:#071712;
  --panel:#0d241c;
  --panel2:#102c22;
  --line:#214a3b;
  --green:#19a974;
  --green2:#0d7d55;
  --gold:#d7a83d;
  --gold2:#9d7220;
  --text:#f2f7f4;
  --muted:#a9c4b8;
  --danger:#d85b5b;
  --shadow:0 10px 30px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:
    radial-gradient(circle at top, #143c2d 0, var(--bg) 45%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}

body{
  padding:12px;
}

button{
  font-family:inherit;
}

.app{
  width:100%;
  max-width:1100px;
  margin:auto;
}

/* HEADER */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(13,36,28,.96);
  box-shadow:var(--shadow);
