<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#07558f">

<meta name="description"
content="Kepengurusan GABSI Kota Tanjungbalai">

<title>
Pengurus GABSI Kota Tanjungbalai
</title>


<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef3f8;
    color: #172033;
    min-height: 100vh;
}


/* =========================
   HEADER
========================= */

.header {
    width: 100%;
    background: linear-gradient(
        135deg,
        #063970,
        #0874bd
    );

    color: white;
    text-align: center;

    padding: 20px 12px;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,0.20);
}

.header h1 {
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 5px;
}

.header p {
    font-size: 13px;
}


/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 1100px;

    margin: auto;

    padding:
        25px 15px 40px;
}


/* =========================
   JUDUL
========================= */

.judul {
    text-align: center;
    margin-bottom: 25px;
}

.judul h2 {
    color: #063970;
    font-size: 24px;
    margin-bottom: 6px;
}

.judul p {
    color: #64748b;
    font-size: 14px;
}


/* =========================
   DAFTAR PENGURUS
========================= */

.daftar-pengurus {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;
}


/* =========================
   KARTU
========================= */

.kartu {

    background: white;

    border-radius: 18px;

    overflow: hidden;

    border:
        1px solid #dce4ec;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,0.12);

    text-align: center;
}


/* =========================
   FOTO
========================= */

.foto {

    width: 100%;

    height: 380px;

    display: block;

    object-fit: cover;

    object-position: center top;

    background: #e5e7eb;
}


/* =========================
   INFORMASI
========================= */

.info {

    padding:
        17px 10px 20px;
}


.jabatan {

    display: inline-block;

    background: #07558f;

    color: white;

    font-size: 12px;

    font-weight: bold;

    padding:
        7px 16px;

    border-radius: 20px;

    margin-bottom: 10px;
}


.nama {

    color: #111827;

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 5px;
}


.organisasi {

    color: #64748b;

    font-size: 13px;
}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    color: #64748b;

    font-size: 12px;

    padding-top: 28px;
}


/* =========================
   TABLET
========================= */

@media
(min-width: 701px)
and
(max-width: 950px) {

    .daftar-pengurus {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .kartu:last-child {

        grid-column:
            1 / -1;

        width: 50%;

        margin: auto;
    }
}


/* =========================
   HP
========================= */

@media (max-width: 700px) {

    .header {

        padding:
            18px 10px;
    }

    .header h1 {

        font-size: 20px;
    }

    .header p {

        font-size: 11px;
    }

    .container {

        padding:
            20px 10px 30px;
    }

    .judul {

        margin-bottom: 20px;
    }

    .judul h2 {

        font-size: 20px;
    }

    .judul p {

        font-size: 12px;
    }

    .daftar-pengurus {

        grid-template-columns: 1fr;

        gap: 18px;
    }

    .kartu {

        width: 100%;

        max-width: 430px;

        margin: auto;
    }

    .foto {

        width: 100%;

        height: auto;

        max-height: 520px;

        object-fit: cover;

        object-position: center top;
    }

    .nama {

        font-size: 19px;
    }

    .organisasi {

        font-size: 12px;
    }
}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <h1>
        GABSI KOTA TANJUNGBALAI
    </h1>

    <p>
        Gabungan Bridge Seluruh Indonesia
    </p>

</header>



<!-- =========================
     KONTEN
========================= -->

<main class="container">


    <div class="judul">

        <h2>
            KEPENGURUSAN GABSI
        </h2>

        <p>
            Kota Tanjungbalai
        </p>

    </div>



    <section class="daftar-pengurus">


        <!-- =========================
             KETUA
        ========================== -->

        <div class="kartu">

            <img
                src="Ketua%20Gabsi%202.jpg"
                class="foto"
                alt="E. Hutabarat - Ketua GABSI Kota Tanjungbalai"
            >

            <div class="info">

                <div class="jabatan">
                    KETUA
                </div>

                <div class="nama">
                    E. Hutabarat
                </div>

                <div class="organisasi">
                    GABSI Kota Tanjungbalai
                </div>

            </div>

        </div>



        <!-- =========================
             BENDAHARA
        ========================== -->

        <div class="kartu">

            <img
                src="Bendahara%20Gabsi.jpg"
                class="foto"
                alt="S. Simbolon - Bendahara GABSI Kota Tanjungbalai"
            >

            <div class="info">

                <div class="jabatan">
                    BENDAHARA
                </div>

                <div class="nama">
                    S. Simbolon
                </div>

                <div class="organisasi">
                    GABSI Kota Tanjungbalai
                </div>

            </div>

        </div>



        <!-- =========================
             SEKERTARIS
        ========================== -->

        <div class="kartu">

            <img
                src="Sekertaris%20Gabsi.jpg"
                class="foto"
                alt="R. Manalu - Sekertaris GABSI Kota Tanjungbalai"
            >

            <div class="info">

                <div class="jabatan">
                    SEKERTARIS
                </div>

                <div class="nama">
                    R. Manalu
                </div>

                <div class="organisasi">
                    GABSI Kota Tanjungbalai
                </div>

            </div>

        </div>


    </section>



    <div class="footer">

        © 2026 GABSI Kota Tanjungbalai

    </div>


</main>


</body>
</html>
