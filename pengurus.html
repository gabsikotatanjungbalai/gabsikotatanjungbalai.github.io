<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07558f">

<title>Pengurus GABSI Kota Tanjungbalai</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f5f9;
    color: #172033;
}

/* =========================
   HEADER
========================= */
.header {
    background: linear-gradient(135deg, #063970, #0b65a8);
    color: white;
    text-align: center;
    padding: 20px 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.18);
}

.header h1 {
    font-size: 25px;
    margin-bottom: 5px;
}

.header p {
    font-size: 13px;
}

/* =========================
   CONTAINER
========================= */
.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px 40px;
}

/* =========================
   JUDUL
========================= */
.title {
    text-align: center;
    margin-bottom: 25px;
}

.title h2 {
    color: #063970;
    font-size: 24px;
    margin-bottom: 6px;
}

.title p {
    color: #64748b;
    font-size: 14px;
}

/* =========================
   GRID PENGURUS
========================= */
.pengurus {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 22px;
}

/* =========================
   KARTU
========================= */
.card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
    box-shadow: 0 5px 18px rgba(0,0,0,0.12);
    text-align: center;
}

/* =========================
   FOTO
========================= */
.foto {
    width: 100%;
    height: 390px;
    display: block;
    object-fit: cover;
    object-position: center top;
    background: #e5e7eb;
}

/* =========================
   INFORMASI
========================= */
.info {
    padding: 17px 10px 20px;
}

.jabatan {
    display: inline-block;
    background: #07558f;
    color: white;
    font-size: 12px;
    font-weight: bold;
    padding: 7px 15px;
    border-radius: 20px;
    margin-bottom: 10px;
}

.nama {
    font-size: 20px;
    font-weight: bold;
    color: #111827;
    margin-bottom: 5px;
}

.organisasi {
    font-size: 13px;
    color: #64748b;
}

/* =========================
   FOOTER
========================= */
.footer {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    padding-top: 28px;
}

/* =========================
   TAMPILAN HP
========================= */
@media (max-width: 700px) {

    .header {
        padding: 18px 10px;
    }

    .header h1 {
        font-size: 20px;
    }

    .header p {
        font-size: 11px;
    }

    .container {
        padding: 20px 10px 30px;
    }

    .title {
        margin-bottom: 20px;
    }

    .title h2 {
        font-size: 20px;
    }

    .title p {
        font-size: 12px;
    }

    .pengurus {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .card {
        width: 100%;
        max-width: 430px;
        margin: auto;
    }

    .foto {
        width: 100%;
        height: auto;
        max-height: 520px;
        object-fit: cover;
        object-position: center top;
    }

    .nama {
        font-size: 19px;
    }

    .organisasi {
        font-size: 12px;
    }
}

/* =========================
   TABLET
========================= */
@media (min-width: 701px) and (max-width: 900px) {

    .pengurus {
        grid-template-columns: repeat(2, 1fr);
    }

    .card:last-child {
        grid-column: 1 / -1;
        max-width: 430px;
        width: 100%;
        margin: auto;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <h1>
        GABSI KOTA TANJUNGBALAI
    </h1>

    <p>
        Gabungan Bridge Seluruh Indonesia
    </p>

</header>


<!-- =========================
     KONTEN
========================= -->

<main class="container">

    <div class="title">

        <h2>
            KEPENGURUSAN GABSI
        </h2>

        <p>
            Kota Tanjungbalai
        </p>

    </div>


    <section class="pengurus">


        <!-- =====================
             KETUA
        ====================== -->

        <div class="card">

            <img
                src="./p1.jpg"
                alt="E. Hutabarat - Ketua GABSI Kota Tanjungbalai"
                class="foto"
            >

            <div class="info">

                <div class="jabatan">
                    KETUA
                </div>

                <div class="nama">
                    E. Hutabarat
                </div>

                <div class="organisasi">
                    GABSI Kota Tanjungbalai
                </div>

            </div>

        </div>


        <!-- =====================
             BENDAHARA
        ====================== -->

        <div class="card">

            <img
                src="./p2.jpg"
                alt="S. Simbolon - Bendahara GABSI Kota Tanjungbalai"
                class="foto"
            >

            <div class="info">

                <div class="jabatan">
                    BENDAHARA
                </div>

                <div class="nama">
                    S. Simbolon
                </div>

                <div class="organisasi">
                    GABSI Kota Tanjungbalai
                </div>

            </div>

        </div>


        <!-- =====================
             SEKERTARIS
        ====================== -->

        <div class="card">

            <img
                src="./p3.jpg"
                alt="R. Manalu - Sekertaris GABSI Kota Tanjungbalai"
                class="foto"
            >

            <div class="info">

                <div class="jabatan">
                    SEKERTARIS
                </div>

                <div class="nama">
                    R. Manalu
                </div>

                <div class="organisasi">
                    GABSI Kota Tanjungbalai
                </div>

            </div>

        </div>


    </section>


    <div class="footer">

        © 2026 GABSI Kota Tanjungbalai

    </div>

</main>

</body>
</html>
