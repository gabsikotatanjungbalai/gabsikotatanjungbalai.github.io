<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengurus GABSI Kota Tanjungbalai</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f1f5f9;
    color:#172033;
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#063970,#0b5fa5);
    color:white;
    padding:25px 15px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
}

.header h1{
    font-size:26px;
    margin-bottom:6px;
}

.header p{
    font-size:15px;
    opacity:.95;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:25px 15px 40px;
}

/* JUDUL */
.title{
    text-align:center;
    margin-bottom:25px;
}

.title h2{
    color:#063970;
    font-size:23px;
    margin-bottom:7px;
}

.title p{
    color:#64748b;
    font-size:14px;
}

/* GRID */
.pengurus{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

/* CARD */
.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
    text-align:center;
    transition:.25s;
    border:1px solid #e2e8f0;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,.18);
}

/* FOTO */
.foto{
    width:100%;
    height:350px;
    object-fit:cover;
    object-position:center top;
    display:block;
    background:#e5e7eb;
}

/* INFORMASI */
.info{
    padding:18px 12px 20px;
}

.jabatan{
    display:inline-block;
    background:#063970;
    color:white;
    padding:7px 16px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    margin-bottom:10px;
}

.nama{
    font-size:20px;
    font-weight:bold;
    color:#111827;
    margin-bottom:5px;
}

.organisasi{
    font-size:13px;
    color:#64748b;
}

/* FOOTER */
.footer{
    margin-top:30px;
    text-align:center;
    color:#64748b;
    font-size:13px;
    padding:15px;
}

/* HP */
@media(max-width:700px){

    .header{
        padding:20px 12px;
    }

    .header h1{
        font-size:21px;
    }

    .header p{
        font-size:13px;
    }

    .container{
        padding:20px 12px 30px;
    }

    .title h2{
        font-size:20px;
    }

    .pengurus{
        grid-template-columns:1fr;
        gap:18px;
    }

    .card{
        max-width:430px;
        width:100%;
        margin:auto;
    }

    .foto{
        height:auto;
        max-height:500px;
        object-fit:cover;
    }

    .nama{
        font-size:19px;
    }
}

/* TABLET */
@media(min-width:701px) and (max-width:900px){

    .pengurus{
        grid-template-columns:repeat(2,1fr);
    }

    .card:last-child{
        grid-column:1 / -1;
        max-width:430px;
        width:100%;
        margin:auto;
    }

}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">
    <h1>GABSI KOTA TANJUNGBALAI</h1>
    <p>Gabungan Bridge Seluruh Indonesia</p>
</header>

<!-- KONTEN -->
<main class="container">

    <div class="title">
        <h2>KEPENGURUSAN GABSI</h2>
        <p>Kota Tanjungbalai</p>
    </div>

    <section class="pengurus">

        <!-- KETUA -->
        <div class="card">

            <img
                src="ketua.jpg"
                alt="E. Hutabarat - Ketua GABSI Kota Tanjungbalai"
                class="foto"
            >

            <div class="info">

                <div class="jabatan">
                    KETUA
                </div>

                <div class="nama">
                    E. Hutabarat
                </div>

                <div class="organisasi">
                    GABSI Kota Tanjungbalai
                </div>

            </div>
        </div>


        <!-- BENDAHARA -->
        <div class="card">

            <img
                src="bendahara.jpg"
                alt="Bendahara GABSI Kota Tanjungbalai"
                class="foto"
            >

            <div class="info">

                <div class="jabatan">
                    BENDAHARA
                </div>

                <div class="nama">
                    Bendahara
                </div>

                <div class="organisasi">
                    GABSI Kota Tanjungbalai
                </div>

            </div>
        </div>


        <!-- SEKRETARIS -->
        <div class="card">

            <img
                src="sekretaris.jpg"
                alt="Sekretaris GABSI Kota Tanjungbalai"
                class="foto"
            >

            <div class="info">

                <div class="jabatan">
                    SEKRETARIS
                </div>

                <div class="nama">
                    Sekretaris
                </div>

                <div class="organisasi">
                    GABSI Kota Tanjungbalai
                </div>

            </div>
        </div>

    </section>

    <div class="footer">
        © 2026 GABSI Kota Tanjungbalai
    </div>

</main>

</body>
</html>
