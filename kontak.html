<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073b61">

<title>Kontak — GABSI Kota Tanjungbalai</title>
<meta name="description" content="Kontak resmi GABSI Kota Tanjungbalai.">

<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">

<style>
:root{
  --navy:#073b61;
  --navy2:#0a567f;
  --red:#d71920;
  --gold:#f4c44e;
  --ink:#14202b;
  --muted:#64748b;
  --bg:#f4f7fa;
  --card:#ffffff;
  --line:#dbe3ea;
  --shadow:0 12px 30px rgba(7,59,97,.10);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
}

a{
  color:inherit;
  text-decoration:none;
}

.topbar{
  background:var(--navy);
  color:#fff;
  padding:9px 18px;
  font-size:13px;
}

.topbar-inner{
  max-width:1180px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
}

.nav{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.nav-inner{
  max-width:1180px;
  margin:auto;
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 18px;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.brand-text{
  line-height:1.15;
}

.brand-text strong{
  display:block;
  color:var(--navy);
  font-size:17px;
}

.brand-text span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:4px;
}

.nav-links a{
  padding:10px 11px;
  border-radius:9px;
  font-size:14px;
  font-weight:700;
  color:#334155;
}

.nav-links a:hover,
.nav-links a.active{
  background:var(--navy);
  color:#fff;
}

.menu-btn{
  display:none;
  border:0;
  background:var(--navy);
  color:#fff;
  border-radius:8px;
  padding:10px 13px;
  font-size:20px;
  cursor:pointer;
}

.container{
  width:min(1180px,calc(100% - 36px));
  margin:auto;
}

.hero{
  background:
    linear-gradient(135deg,rgba(7,59,97,.98),rgba(10,86,127,.94));
  color:#fff;
  padding:70px 0;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:35px;
  align-items:center;
}

.eyebrow{
  display:inline-block;
  color:var(--gold);
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:12px;
}

.hero h1{
  margin:0 0 15px;
  font-size:clamp(34px,5vw,56px);
  line-height:1.05;
}

.hero p{
  color:#e2edf5;
  max-width:700px;
  font-size:17px;
}

.hero-card{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.20);
  border-radius:18px;
  padding:25px;
  backdrop-filter:blur(5px);
}

.hero-card strong{
  display:block;
  font-size:22px;
  margin-bottom:8px;
}

.hero-card span{
  color:#dcecf7;
}

.section{
  padding:65px 0;
}

.section-title{
  margin-bottom:30px;
}

.section-title h2{
  color:var(--navy);
  margin:0 0 8px;
  font-size:32px;
}

.section-title p{
  margin:0;
  color:var(--muted);
}

.contact-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:28px;
  box-shadow:var(--shadow);
}

.card h3{
  color:var(--navy);
  margin-top:0;
  margin-bottom:18px;
  font-size:22px;
}

.contact-item{
  display:flex;
  gap:16px;
  align-items:flex-start;
  padding:17px 0;
  border-bottom:1px solid var(--line);
}

.contact-item:last-child{
  border-bottom:0;
}

.icon{
  width:45px;
  height:45px;
  flex:none;
  border-radius:12px;
  background:#eaf3f8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.contact-item strong{
  display:block;
  color:var(--navy);
  margin-bottom:3px;
}

.contact-item span{
  color:var(--muted);
  font-size:14px;
}

.notice{
  background:#fff8df;
  border:1px solid #f0d36c;
  border-radius:14px;
  padding:18px;
  margin-top:20px;
  color:#654f00;
}

.info-box{
  margin-top:25px;
  padding:25px;
  border-radius:18px;
  background:linear-gradient(135deg,#073b61,#0a567f);
  color:#fff;
}

.info-box h3{
  margin-top:0;
  color:#fff;
}

.info-box p{
  color:#e2edf5;
}

.button-row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:20px;
}

.btn{
  display:inline-block;
  padding:12px 18px;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
}

.btn-primary{
  background:var(--red);
  color:#fff;
}

.btn-secondary{
  background:#fff;
  color:var(--navy);
  border:1px solid var(--line);
}

footer{
  background:#062f4e;
  color:#dbe8f0;
  padding:35px 0;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  gap:30px;
}

footer h3{
  color:#fff;
  margin-top:0;
}

footer p{
  color:#b9ccd9;
  font-size:14px;
}

.footer-links{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.footer-links a{
  color:#dbe8f0;
  font-size:14px;
}

.footer-links a:hover{
  color:var(--gold);
}

.copyright{
  border-top:1px solid rgba(255,255,255,.12);
  margin-top:25px;
  padding-top:20px;
  font-size:13px;
  color:#a9bfce;
}

/* RESPONSIVE */
@media(max-width:850px){

  .nav-links{
    display:none;
    position:absolute;
    left:15px;
    right:15px;
    top:70px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    padding:10px;
    flex-direction:column;
    align-items:stretch;
  }

  .nav-links.show{
    display:flex;
  }

  .nav-links a{
    width:100%;
  }

  .menu-btn{
    display:block;
  }

  .hero-grid{
    grid-template-columns:1fr;
  }

  .contact-grid{
    grid-template-columns:1fr;
  }

  .footer-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:500px){

  .topbar-inner{
    justify-content:center;
    text-align:center;
  }

  .container{
    width:min(100% - 24px,1180px);
  }

  .nav-inner{
    padding:9px 12px;
  }

  .brand-text strong{
    font-size:14px;
  }

  .brand-text span{
    font-size:9px;
  }

  .brand img{
    width:42px;
    height:42px;
  }

  .hero{
    padding:50px 0;
  }

  .hero h1{
    font-size:36px;
  }

  .section{
    padding:45px 0;
  }

  .card{
    padding:21px;
  }
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-inner">
    <div>GABSI Kota Tanjungbalai •
